<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc">
<title id="title">Water Tank Monitor — mapa de conexões, revisão A</title>
<desc id="desc">Interligação de módulos ao ESP32. Turbidez e pH possuem divisores de 15 e 10 quilohms e filtros de 100 nanofarads. TDS usa resistor de um quilohm e capacitor de 100 nanofarads. Os detalhes de alimentação e validação constam no guia.</desc>
<defs>
<style>
text{font-family:Arial,sans-serif;fill:#183047;font-size:17px}
.title{font-size:32px;font-weight:700;fill:white}
.sub{fill:#bed7eb;font-size:17px}
.head{font-size:20px;font-weight:700}
.small{font-size:15px}
.muted{fill:#536b7d}
.wire{fill:none;stroke:#0284c7;stroke-width:3}
.ground{fill:none;stroke:#64748b;stroke-width:2}
.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}
.node{fill:#0284c7}
.res{fill:#fff;stroke:#0284c7;stroke-width:2}
</style>
</defs>
<rect width="1400" height="1120" fill="#f1f5f9"/>
<rect width="1400" height="130" fill="#102b42"/>
<text x="45" y="55" class="title">WATER TANK MONITOR</text>
<text x="45" y="91" class="sub">Mapa elétrico de interligação • Revisão A • Protótipo de bancada</text>
<rect x="1000" y="35" width="355" height="57" rx="12" fill="#854d0e"/>
<text x="1025" y="70" style="fill:white;font-weight:bold">PRELIMINAR · NÃO ENSAIADO</text>

<rect x="40" y="155" width="1320" height="110" rx="12" class="box"/>
<text x="65" y="187" class="head">Alimentação • redes comuns em todos os blocos</text>
<text x="65" y="221">Fonte isolada 5 V → F1 1 A* → S1 → +5V_SYS: DevKit / turbidez / pH</text>
<text x="65" y="246" class="small muted">*Fusível provisório. C4: 100 µF entre +5V_SYS e GND. Não usar fonte externa e USB simultaneamente.</text>
<text x="860" y="221">DevKit 3V3 → TDS / DS18B20 / OLED</text>
<text x="860" y="246" class="small muted">C5–C9: 100 nF locais. GND comum.</text>

<rect x="1050" y="295" width="310" height="650" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="1080" y="333" class="head">U1 · ESP32 DevKit</text>
<text x="1080" y="360" class="small muted">ESP32-WROOM-32 clássico</text>
<text x="1080" y="390" class="small">Alimentação: 5V_SYS / GND</text>
<text x="1080" y="440">GPIO34 · ADC1_CH6</text>
<text x="1080" y="600">GPIO35 · ADC1_CH7</text>
<text x="1080" y="760">GPIO32 · ADC1_CH4</text>
<text x="1080" y="840">GPIO4 · DQ</text>
<text x="1080" y="885">GPIO21 · SDA</text>
<text x="1080" y="920">GPIO22 · SCL</text>

<rect x="40" y="295" width="970" height="90" rx="10" fill="#fef3c7"/>
<text x="60" y="324" class="head">Conferir os módulos recebidos antes de conectar</text>
<text x="60" y="350" class="small">Posição física dos pinos não representada. Usar nomes de GPIO e rótulos verificados.</text>
<text x="60" y="373" class="small">Módulos condicionadores ficam secos; sondas usam os conectores próprios dos módulos.</text>

<rect x="40" y="402" width="280" height="115" rx="10" class="box"/>
<text x="60" y="435" class="head">U2 · Turbidez</text>
<text x="60" y="462">VCC: +5V_SYS / GND</text>
<text x="60" y="491" class="small muted">Saída analógica →</text>
<path d="M320 435H405 M475 435H1050" class="wire"/>
<rect x="405" y="426" width="70" height="18" class="res"/>
<text x="390" y="416" class="small">R1 · 15 kΩ</text>
<circle cx="650" cy="435" r="5" class="node"/>
<text x="750" y="420" class="small">TP1 · 0,4 × Vout</text>
<path d="M650 435V460 M650 493V510H815V478 M815 435V466" class="wire"/>
<rect x="641" y="460" width="18" height="33" class="res"/>
<path d="M800 466H830 M800 478H830" class="wire"/>
<text x="670" y="484" class="small">R2 · 10 kΩ</text>
<text x="839" y="481" class="small">C1 · 100 nF</text>
<text x="625" y="533" class="small">GND</text>

<rect x="40" y="562" width="280" height="115" rx="10" class="box"/>
<text x="60" y="595" class="head">U3 · pH PH4502C</text>
<text x="60" y="622">VCC: +5V_SYS / GND</text>
<text x="60" y="651" class="small muted">Saída analógica →</text>
<path d="M320 595H405 M475 595H1050" class="wire"/>
<rect x="405" y="586" width="70" height="18" class="res"/>
<text x="390" y="576" class="small">R3 · 15 kΩ</text>
<circle cx="650" cy="595" r="5" class="node"/>
<text x="750" y="580" class="small">TP2 · 0,4 × Vout</text>
<path d="M650 595V620 M650 653V670H815V638 M815 595V626" class="wire"/>
<rect x="641" y="620" width="18" height="33" class="res"/>
<path d="M800 626H830 M800 638H830" class="wire"/>
<text x="670" y="644" class="small">R4 · 10 kΩ</text>
<text x="839" y="641" class="small">C2 · 100 nF</text>
<text x="625" y="693" class="small">GND</text>

<rect x="40" y="722" width="280" height="95" rx="10" class="box"/>
<text x="60" y="755" class="head">U4 · TDS</text>
<text x="60" y="783">VCC: +3V3 / GND</text>
<text x="60" y="805" class="small muted">Exige saída de 0–2,3 V</text>
<path d="M320 755H405 M475 755H1050 M815 755V772 M815 784V805" class="wire"/>
<rect x="405" y="746" width="70" height="18" class="res"/>
<text x="390" y="736" class="small">R5 · 1 kΩ</text>
<circle cx="815" cy="755" r="5" class="node"/>
<path d="M800 772H830 M800 784H830" class="wire"/>
<text x="839" y="790" class="small">C3 · 100 nF</text>
<text x="790" y="825" class="small">GND</text>
<text x="880" y="740" class="small">TP3</text>

<rect x="40" y="837" width="430" height="108" rx="10" class="box"/>
<text x="60" y="868" class="head">U5 · DS18B20</text>
<text x="60" y="894" class="small">VDD: +3V3 / GND · DQ → GPIO4</text>
<text x="60" y="922" class="small">R6: 4,7 kΩ entre DQ e +3V3</text>
<path d="M470 850H525V835H1050" class="wire"/>
<rect x="555" y="860" width="455" height="85" rx="10" class="box"/>
<text x="575" y="887" class="head">U6 · OLED I²C</text>
<text x="575" y="912" class="small">VCC: +3V3 / GND · SDA / SCL →</text>
<text x="575" y="934" class="small">R7/R8: pull-ups opcionais de 4,7 kΩ a +3V3</text>
<path d="M1010 880H1050 M1010 915H1050" class="wire"/>

<rect x="40" y="975" width="1320" height="105" rx="12" fill="#e2e8f0"/>
<text x="65" y="1005" class="head">Condições desta revisão</text>
<text x="65" y="1033">pH e TDS em porções separadas da amostra • Sem isolamento entre sondas • Validar saídas antes dos GPIOs</text>
<text x="65" y="1059" class="small muted">Consultar hardware/README.md para ligações completas, cálculos, alimentação, pendências e sequência de testes.</text>
</svg>
